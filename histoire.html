<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Son histoire — Étoile de Framboisier</title>
    <meta name="description" content="L'histoire d'Étoile de Framboisier, de sa naissance à son règne de meneur du Tonnerre, et le journal des lunes de ses sujets de RP.">
    <meta name="theme-color" content="#F5EFDF">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Figtree:wght@400;500;600&family=Caveat:wght@500;600&display=swap">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/histoire.css">
</head>
<body data-page="histoire">

    <div id="entete"></div>

    <main id="contenu">

        <header class="tete-page conteneur">
            <span class="lavis lavis-framboise" style="top:-16%; left:-6%; width:480px; height:360px"></span>
            <span class="lavis lavis-roux" style="top:6%; left:40%; width:460px; height:320px"></span>
            <span class="surtitre">Son histoire</span>
            <h1 id="histoire-titre">Chronique d'un destin brisé</h1>
            <p class="intro" id="histoire-intro">Le parcours d'un colosse devenu le gardien de la concorde au sein du Tonnerre.</p>
        </header>

        <div class="conteneur" data-onglets>

            <section class="onglet-panneau" id="chronique" data-titre="La chronique">
                <ol class="chronique" id="chronique-liste"></ol>
            </section>

            <section class="onglet-panneau" id="journal" data-titre="Journal des lunes">
                <div class="journal-outils">
                    <p class="journal-bilan" id="journal-bilan"></p>
                    <button type="button" class="bouton bouton-clair bouton-petit" id="journal-ordre" aria-pressed="false">Voir le plus récent en premier</button>
                </div>
                <div class="fil-journal" id="journal-fil"></div>
            </section>

        </div>
    </main>

    <div id="pied"></div>

    <script src="js/site.js"></script>
    <script src="js/outils.js"></script>
    <script src="js/data/journal.js"></script>
    <script src="js/data/textes.js"></script>
    <script src="js/config.js"></script>
    <script src="js/donnees.js"></script>
    <script src="js/pages/histoire.js"></script>
</body>
</html>
