<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Son monde — Étoile de Framboisier</title>
    <meta name="description" content="Le monde d'Étoile de Framboisier : sa lignée, ses relations avec son clan et les chats qui comptent, et la diplomatie avec les autres clans.">
    <meta name="theme-color" content="#F5EFDF">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Figtree:wght@400;500;600&family=Caveat:wght@500;600&display=swap">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/monde.css">
</head>
<body data-page="monde">

    <div id="entete"></div>

    <main id="contenu">

        <header class="tete-page conteneur">
            <span class="lavis lavis-azur" style="top:-14%; left:-6%; width:500px; height:360px"></span>
            <span class="lavis lavis-sauge" style="top:8%; left:42%; width:480px; height:320px"></span>
            <span class="surtitre">Son monde</span>
            <h1>Les liens de sang, de cœur et de devoir</h1>
            <p class="intro">Ceux dont il descend, ceux qu'il protège, ceux qu'il observe de loin.</p>
        </header>

        <div class="conteneur" data-onglets>

            <section class="onglet-panneau" id="lignee" data-titre="Lignée">
                <p class="origine" id="origine"></p>
                <div class="arbre" id="arbre"></div>
            </section>

            <section class="onglet-panneau" id="relations" data-titre="Relations">
                <div class="deux-col-monde">
                    <div class="carte prose lettrine" id="clan-texte"></div>
                    <aside class="carte legende-carte" aria-label="Légende des sentiments">
                        <h3>Affinités et sentiments</h3>
                        <ul class="legende" id="legende"></ul>
                    </aside>
                </div>
                <div class="entete-section visages-titre">
                    <span class="surtitre">Les visages de son quotidien</span>
                    <h2>Ceux qui comptent</h2>
                </div>
                <div class="filtres" id="filtres" role="group" aria-label="Filtrer les relations"></div>
                <ul class="relations" id="visages"></ul>
            </section>

            <section class="onglet-panneau" id="diplomatie" data-titre="Diplomatie">
                <div class="entete-section">
                    <span class="surtitre">Au-delà de la frontière</span>
                    <h2>Diplomatie et frontières extérieures</h2>
                </div>
                <div class="clans" id="clans"></div>
            </section>

        </div>
    </main>

    <div id="pied"></div>

    <script src="js/site.js"></script>
    <script src="js/outils.js"></script>
    <script src="js/data/relations.js"></script>
    <script src="js/data/lignee.js"></script>
    <script src="js/data/textes.js"></script>
    <script src="js/config.js"></script>
    <script src="js/donnees.js"></script>
    <script src="js/pages/monde.js"></script>
</body>
</html>
